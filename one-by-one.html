<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Loft 12 — Photo Viewer</title>
  <link rel="stylesheet" href="styles.css">
</head>

<body class="motion">

<div class="viewer-wrap">

  <!-- Top Bar -->
  <div class="viewer-topbar">
    <div class="viewer-title">Loft 12 Photos</div>

    <div class="viewer-controls">
      <button id="themeToggle" class="theme-toggle" aria-label="Toggle theme">
        <span class="sun">☼</span>
        <span class="moon">☾</span>
      </button>

      <a href="index.html" class="viewer-close">Close ✕</a>
    </div>
  </div>

  <!-- Image Viewer -->
  <div class="viewer-stage">
    <button class="nav prev" aria-label="Previous photo">‹</button>

    <img id="viewerImage" src="images/photo1.jpeg" alt="Loft photo">

    <button class="nav next" aria-label="Next photo">›</button>
  </div>

  <!-- Caption / Counter -->
  <div class="viewer-caption">
    <span id="photoCounter">1 / 30</span>
  </div>

</div>

<script>
/* ===============================
   PHOTO VIEWER LOGIC
================================= */

const TOTAL = 30; // number of photos
let current = 1;

const img = document.getElementById("viewerImage");
const counter = document.getElementById("photoCounter");

function updateViewer() {
  img.src = `images/photo${current}.jpeg`;
  counter.textContent = `${current} / ${TOTAL}`;
}

// navigation
document.querySelector(".next").onclick = () => {
  current = current === TOTAL ? 1 : current + 1;
  updateViewer();
};

document.querySelector(".prev").onclick = () => {
  current = current === 1 ? TOTAL : current - 1;
  updateViewer();
};

// keyboard navigation
document.addEventListener("keydown", e => {
  if (e.key === "ArrowRight") document.querySelector(".next").click();
  if (e.key === "ArrowLeft") document.querySelector(".prev").click();
});

// swipe navigation (mobile)
let touchStartX = 0;
document.addEventListener("touchstart", e => touchStartX = e.changedTouches[0].screenX);
document.addEventListener("touchend", e => {
  let diff = e.changedTouches[0].screenX - touchStartX;
  if (diff > 50) document.querySelector(".prev").click();
  if (diff < -50) document.querySelector(".next").click();
});

/* ===============================
   THEME TOGGLE (shared)
================================= */

(function () {
  const key = "loft_theme";
  const btn = document.getElementById("themeToggle");
  const saved = localStorage.getItem(key);

  function setTheme(theme) {
    document.documentElement.setAttribute("data-theme", theme);
    localStorage.setItem(key, theme);
  }

  if (!saved) {
    const prefersDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
    document.documentElement.setAttribute("data-theme", prefersDark ? "dark" : "light");
  } else {
    document.documentElement.setAttribute("data-theme", saved);
  }

  btn.addEventListener("click", () => {
    const current = document.documentElement.getAttribute("data-theme") || "dark";
    setTheme(current === "dark" ? "light" : "dark");
  });
})();
</script>

</body>
</html>
